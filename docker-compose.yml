services:
  # -----------------------------------------------
  # 1. Nginx 역방향 프록시 (포트 80 노출)
  # -----------------------------------------------
  nginx:
    image: nginx:latest
    container_name: campustour-nginx
    ports:
      - "80:80"                # 외부에서는 80 포트로만 접근 가능
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # -----------------------------------------------
  # 2. Next.js 프론트엔드
  # -----------------------------------------------
  frontend:
    build: ./frontend
    container_name: campustour-frontend
    environment:
      - API_BASE_URL=http://backend:8000 # 도커 내부 네트워크를 통해 백엔드와 통신
      - NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped

  # -----------------------------------------------
  # 3. FastAPI 백엔드 서버
  # -----------------------------------------------
  backend:
    build: ./backend
    container_name: campustour-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./campusdata:/campusdata:ro
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NAVER_MAP_CLIENT_ID=${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
      - NAVER_MAP_CLIENT_SECRET=${NAVER_MAP_CLIENT_SECRET}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------
  # 4. Neo4j 지식 그래프 데이터베이스
  # -----------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: campustour-neo4j
    ports:
      - "127.0.0.1:7475:7474"  # 보안을 위해 로컬호스트(SSH 터널링)에서만 접근 가능하도록 변경
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      # 4GB 서버(e2-medium) OOM 방지를 위한 메모리 제한 설정
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Neo4j 시드 데이터 적재
  data-loader:
    build: ./backend
    container_name: campustour-data-loader
    command: ["python", "/data/neo4j_loader_v2.py"]
    volumes:
      - ./campusdata:/data:ro
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

volumes:
  neo4j_data:
