services:
  # -----------------------------------------------
  # 1. Caddy 역방향 프록시 (운영 HTTPS 자동 발급·갱신)
  # -----------------------------------------------
  caddy:
    image: caddy:2.10.2-alpine
    container_name: campustour-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 로컬에서는 HTTP를 유지하고, 배포 워크플로가 공개 도메인을 주입하면 HTTPS를 자동 활성화한다.
      - CAMPUS_SITE_ADDRESS=${CAMPUS_SITE_ADDRESS:-http://localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # -----------------------------------------------
  # 2. Next.js 프론트엔드
  # -----------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID:?NEXT_PUBLIC_NAVER_MAP_CLIENT_ID must be set}
    container_name: campustour-frontend
    environment:
      - API_BASE_URL=http://backend:8000 # 도커 내부 네트워크를 통해 백엔드와 통신
      - NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID:?NEXT_PUBLIC_NAVER_MAP_CLIENT_ID must be set}
    depends_on:
      - backend
    restart: unless-stopped

  # -----------------------------------------------
  # 3. FastAPI 백엔드 서버
  # -----------------------------------------------
  backend:
    build: ./backend
    container_name: campustour-backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
      - ./campusdata:/campusdata:ro
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NAVER_MAP_CLIENT_ID=${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
      - NAVER_MAP_CLIENT_SECRET=${NAVER_MAP_CLIENT_SECRET}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID:-}
      - GOOGLE_CLOUD_REGION=${GOOGLE_CLOUD_REGION:-global}
      - TTS_BUCKET_NAME=${TTS_BUCKET_NAME:-}
      - TTS_MODEL=${TTS_MODEL:-gemini-2.5-flash-tts}
      - TTS_VOICE_NAME=${TTS_VOICE_NAME:-Kore}
      - TTS_PROMPT_VERSION=${TTS_PROMPT_VERSION:-v1}
      - TTS_REALTIME_ENABLED=${TTS_REALTIME_ENABLED:-true}
      - TTS_ALLOWED_ORIGINS=${TTS_ALLOWED_ORIGINS:-}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # 고정 음성 자산을 GCS에 생성하는 일회성 작업. campusdata와 시스템 음성
  # 폴더만 쓰기 가능하며, 일반 backend 컨테이너는 계속 읽기 전용으로 유지한다.
  audio-asset-generator:
    build: ./backend
    command: ["python", "/app/scripts/generate_audio_assets.py", "--allow-missing-core-docent", "--apply"]
    volumes:
      - ./backend:/app
      - ./campusdata:/campusdata
      - ./frontend/public/audio/system:/frontend/audio/system
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID:-}
      - GOOGLE_CLOUD_REGION=${GOOGLE_CLOUD_REGION:-global}
      - TTS_BUCKET_NAME=${TTS_BUCKET_NAME:-}
      - TTS_MODEL=${TTS_MODEL:-gemini-2.5-flash-tts}
      - TTS_VOICE_NAME=${TTS_VOICE_NAME:-Kore}
      - TTS_PROMPT_VERSION=${TTS_PROMPT_VERSION:-v1}
      - DOCENT_SCRIPT_MODEL=${DOCENT_SCRIPT_MODEL:-gemini-3.6-flash}
      - DOCENT_SCRIPT_PROMPT_VERSION=${DOCENT_SCRIPT_PROMPT_VERSION:-v1}
      - AUDIO_SYSTEM_PUBLIC_DIR=/frontend/audio/system
    profiles: ["audio"]
    restart: "no"

  # -----------------------------------------------
  # 4. Neo4j 지식 그래프 데이터베이스
  # -----------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: campustour-neo4j
    ports:
      - "127.0.0.1:7475:7474"  # 보안을 위해 로컬호스트(SSH 터널링)에서만 접근 가능하도록 변경
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      # 4GB 서버(e2-medium) OOM 방지를 위한 메모리 제한 설정
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Neo4j 시드 데이터 적재
  data-loader:
    build: ./backend
    container_name: campustour-data-loader
    command: ["python", "/data/neo4j_loader_v2.py"]
    volumes:
      - ./campusdata:/data:ro
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

volumes:
  neo4j_data:
  caddy_data:
  caddy_config:
