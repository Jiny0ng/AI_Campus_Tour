name: Refresh managed GCP TTS assets

on:
  # Every Monday at 03:00 KST (Sunday 18:00 UTC).
  # Content hashes make unchanged assets a no-op.
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: production-audio-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate changed managed assets on the production VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd ~/AI_Campus_Tour
            # Override any legacy value left in the VM's persistent .env so a
            # prompt rollout invalidates and regenerates every docent script.
            export DOCENT_SCRIPT_PROMPT_VERSION="v3"
            # The deployed revision is the content source of truth. The script
            # compares content hashes and synthesizes/uploads only changed rows.
            docker-compose --profile audio run --rm audio-asset-generator \
              python /app/scripts/generate_docent_assets.py --apply
            docker-compose --profile audio run --rm audio-asset-generator
            docker-compose exec -T backend python /app/scripts/validate_audio_manifest.py
            docker-compose restart backend
