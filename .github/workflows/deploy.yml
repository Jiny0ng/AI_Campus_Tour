name: Deploy to GCP VM

on:
  push:
    branches:
      - main # main 브랜치에 코드가 푸시되면 실행됩니다.
  workflow_dispatch:
    inputs:
      regenerate_audio:
        description: Regenerate every audio asset with the selected Pro/WAV preset and delete legacy Flash/MP3 objects
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GCP_DEPLOY_HOST: ${{ secrets.GCP_VM_HOST }}
          CAMPUS_DOMAIN: ${{ vars.CAMPUS_DOMAIN || 'gabokka.duckdns.org' }}
          REGENERATE_ALL_AUDIO: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_audio || false }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 110m
          envs: GCP_DEPLOY_HOST,CAMPUS_DOMAIN,REGENERATE_ALL_AUDIO
          script: |
            set -Eeuo pipefail

            deployment_debug_dump() {
              exit_code=$?
              echo "::group::Deployment failure diagnostics"
              docker-compose ps || true
              docker-compose logs --tail=200 || true
              df -h || true
              free -h || true
              echo "::endgroup::"
              exit "$exit_code"
            }

            trap deployment_debug_dump ERR

            # 1. 작업 디렉토리로 이동 (디렉토리가 없으면 최초 클론 시 사용하는 폴더 이름에 맞게 수정하세요)
            cd ~/AI_Campus_Tour

            echo "::group::Deployment host"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
            docker --version
            docker-compose --version
            df -h
            free -h
            echo "::endgroup::"
            
            # 2. 최신 코드 가져오기
            git fetch --all
            git reset --hard origin/main
            echo "DEPLOY_COMMIT=$(git rev-parse HEAD)"
            echo "DEPLOY_BRANCH=$(git branch --show-current)"

            # SSH 접속 호스트와 공개 서비스 도메인을 분리한다.
            # Caddy는 CAMPUS_DOMAIN으로 공개 인증서를 자동 발급·갱신한다.
            test -n "$CAMPUS_DOMAIN"
            export CAMPUS_SITE_ADDRESS="$CAMPUS_DOMAIN"
            # The deployed code owns the active docent prompt schema. Do not
            # let a stale value in the VM's persistent .env reuse old scripts.
            export DOCENT_SCRIPT_PROMPT_VERSION="v3"
            echo "DEPLOY_URL=https://$CAMPUS_DOMAIN"
            docker-compose config --services
            
            # 3. 빌드 성공 후 새 컨테이너로 교체
            docker-compose build
            docker-compose --profile seed build data-loader
            docker-compose down --remove-orphans
            docker-compose up -d neo4j
            # 기준 CSV를 비파괴 방식으로 반영한다. --reset은 운영 데이터를 삭제하므로 사용하지 않는다.
            docker-compose --profile seed run --rm data-loader
            docker-compose up -d --remove-orphans
            docker-compose ps

            if [[ "$REGENERATE_ALL_AUDIO" == "true" ]]; then
              echo "::group::Regenerate all Pro/WAV audio"
              docker-compose --profile audio run --rm audio-asset-generator \
                python /app/scripts/generate_docent_assets.py --apply
              docker-compose --profile audio run --rm audio-asset-generator
              docker-compose --profile audio run --rm audio-asset-generator \
                python /app/scripts/validate_audio_manifest.py
              docker-compose --profile audio run --rm audio-asset-generator \
                python /app/scripts/delete_legacy_tts_assets.py --apply
              echo "::endgroup::"
            fi

            # 4. 백엔드가 준비될 때까지 대기
            ready=0
            for attempt in $(seq 1 30); do
              if docker-compose exec -T backend python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"; then
                ready=1
                break
              fi
              echo "Waiting for backend... ($attempt/30)"
              sleep 2
            done
            test "$ready" -eq 1

            # 5. 비밀값을 노출하지 않는 런타임 진단
            echo "::group::Backend runtime diagnostics"
            docker-compose exec -T backend python /app/scripts/runtime_diagnostics.py
            docker-compose exec -T backend python -c "from urllib.request import urlopen; import json; payload=json.load(urlopen('http://127.0.0.1:8000/health/network', timeout=3)); assert payload['status']=='ok'; print('network_health=ok')"
            echo "::endgroup::"

            echo "::group::Frontend runtime diagnostics"
            docker-compose exec -T frontend node -e "const keys=['API_BASE_URL','NEXT_PUBLIC_NAVER_MAP_CLIENT_ID']; console.log(JSON.stringify({environmentPresence:Object.fromEntries(keys.map(key=>[key,Boolean(process.env[key])]))}))"
            docker-compose exec -T frontend node -e "fetch('http://127.0.0.1:3000/').then(async response=>{console.log(JSON.stringify({homeStatus:response.status,contentType:response.headers.get('content-type')})); if(!response.ok) process.exit(1)}).catch(error=>{console.error(error.message);process.exit(1)})"
            echo "::endgroup::"

            echo "::group::HTTPS reverse proxy smoke test"
            https_ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 15 \
                --resolve "$CAMPUS_DOMAIN:443:127.0.0.1" \
                "https://$CAMPUS_DOMAIN/" > /dev/null; then
                https_ready=1
                break
              fi
              echo "Waiting for HTTPS certificate... ($attempt/30)"
              sleep 5
            done
            test "$https_ready" -eq 1

            redirect_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Host: $CAMPUS_DOMAIN" http://127.0.0.1/)"
            test "$redirect_status" = "308"
            echo "https_home_status=ok"
            echo "http_redirect_status=$redirect_status"
            echo "::endgroup::"

            trap - ERR
            
            # 6. 안 쓰는 더미 이미지 정리 (디스크 용량 확보)
            docker image prune -f

      - name: Verify public HTTPS endpoint
        env:
          CAMPUS_DOMAIN: ${{ vars.CAMPUS_DOMAIN || 'gabokka.duckdns.org' }}
        run: |
          set -euo pipefail
          campus_origin="https://$CAMPUS_DOMAIN"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "$campus_origin/" > /dev/null; then
              if curl --fail --silent --show-error --max-time 15 "$campus_origin/api/health/network" > /dev/null; then
                echo "Public HTTPS endpoint is ready: $campus_origin"
                exit 0
              fi
            fi
            echo "Waiting for public HTTPS endpoint... ($attempt/30)"
            sleep 5
          done

          echo "Public HTTPS verification failed. Confirm that GCP allows inbound TCP port 443."
          exit 1
