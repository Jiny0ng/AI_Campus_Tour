name: Generate ending prompt samples

on:
  workflow_dispatch:

concurrency:
  group: production-campus-mutation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate three isolated Pro WAV samples
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            cd ~/AI_Campus_Tour
            export TTS_MANIFEST_PATH="/runtime/audio_content/audio_manifest.json"
            docker-compose --profile audio run --rm audio-asset-generator \
              python /app/scripts/generate_ending_prompt_samples.py --upload
            docker-compose restart backend
